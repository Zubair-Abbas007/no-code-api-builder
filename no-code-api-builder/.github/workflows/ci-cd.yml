name: CI/CD Pipeline — No-Code API Builder

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Lint
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'          # Cache npm dependencies for faster runs

      - name: Install dependencies
        run: npm ci               # Clean install — faster & reproducible in CI

      - name: Run ESLint
        run: npm run lint

  # ──────────────────────────────────────────────
  # JOB 2: Test (runs in parallel with lint)
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

  # ──────────────────────────────────────────────
  # JOB 3: Build (depends on lint + test passing)
  # ──────────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, test]          # Only runs if both lint and test pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Run build step
        run: npm run build

      - name: Verify server entry point exists
        run: test -f server/index.js && echo "✅ server/index.js found"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            server/
            public/
            package.json
            package-lock.json
          retention-days: 1

  # ──────────────────────────────────────────────
  # JOB 4: Deploy to Render (only on main branch)
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --fail \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # RENDER_DEPLOY_HOOK_URL must be set in GitHub repo secrets.
        # Get it from: Render Dashboard → Your Service → Settings → Deploy Hook

      - name: Deployment triggered
        run: echo "✅ Render deployment triggered successfully"
